; OnRoute — firmware di TEST per ESP32 + GPS NEO-6M
; Scopo: verificare che l'hardware funzioni end-to-end (GPS -> WiFi -> Railway)
; senza il Mac collegato. Non è il firmware definitivo.
;
; Build & flash (da dentro questa cartella):
;   pio run -t upload
;   pio device monitor

[env:esp32_test]
; ^6.7.0: qualsiasi 6.x recente (core Arduino 2.0.16/2.0.17, ESP-IDF 4.4.7),
; compatibile con quella già installata per il progetto esp32/
platform = espressif32@^6.7.0
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
; esp32_exception_decoder: se l'ESP32 va in crash, traduce gli indirizzi in righe di codice
; time: mette un timestamp davanti a ogni riga del monitor seriale
monitor_filters = esp32_exception_decoder, time

; Legge il file .env e lo trasforma in #define ENV_<CHIAVE> "valore" (vedi load_env.py)
extra_scripts = pre:load_env.py

; Schermo SH1106 (tipico dei 1.3") invece di SSD1306? Togli il ; qui sotto.
;build_flags = -D OLED_SH1106

lib_deps =
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.2.2
	mikalhart/TinyGPSPlus@^1.1.0
	olikraus/U8g2@^2.35.19
